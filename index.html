<!DOCTYPE html>
<!-- Mi Gerente · Sebastián M -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Gerente">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="theme-color" content="#092A30">
<title>Mi Gerente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
/* Layout: barra inferior en móvil, riel lateral desde 900px. Cifras grandes en serif, texto en grotesca limpia, líneas finas en vez de tarjetas. */
:root{
  --bg:#ECEFEE; --surface:#F8FAF9; --surface2:#E1E7E6; --ink:#10242A; --ink2:#52676D; --line:#D2DAD9;
  --accent:#0E5C66; --accent-ink:#FFFFFF;
  --gold:#B08A42; --hero1:#092A30; --hero2:#12505A; --hero-ink:#F2F7F6; --hero-mute:#9DBFC3;
  --shadow:0 1px 2px rgba(16,36,42,.05),0 16px 36px -16px rgba(16,36,42,.18);
  --good:#2C7A5B; --warn:#A87612; --bad:#B34A36;
  --c-ess:#8497A0; --c-min:#C27B67; --c-extra:#0E5C66; --c-save:#C49A3C; --c-free:#7A8FBF;
  --display:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --body:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1215; --surface:#111C20; --surface2:#1A2A30; --ink:#E8F0EF; --ink2:#93A9AE; --line:#243439;
    --accent:#5FC1BB; --accent-ink:#06191B; --gold:#D9B66A; --hero1:#0E3A41; --hero2:#17636B; --shadow:0 18px 40px -18px rgba(0,0,0,.75);
    --good:#58C79A; --warn:#E0B459; --bad:#E58770;
    --c-ess:#6C8089; --c-min:#D48C78; --c-extra:#5FC1BB; --c-save:#D8B35A; --c-free:#8FA3D4;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1215; --surface:#111C20; --surface2:#1A2A30; --ink:#E8F0EF; --ink2:#93A9AE; --line:#243439;
  --accent:#5FC1BB; --accent-ink:#06191B; --gold:#D9B66A; --hero1:#0E3A41; --hero2:#17636B; --shadow:0 18px 40px -18px rgba(0,0,0,.75);
  --good:#58C79A; --warn:#E0B459; --bad:#E58770;
  --c-ess:#6C8089; --c-min:#D48C78; --c-extra:#5FC1BB; --c-save:#D8B35A; --c-free:#8FA3D4;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{touch-action:manipulation;-webkit-touch-callout:none}
body{-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text;font-size:max(16px,1em)}
html,body{height:100%}
body{background:var(--bg) radial-gradient(900px 420px at 85% -80px,color-mix(in srgb,var(--accent) 12%,transparent),transparent) no-repeat;color:var(--ink);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-weight:400;text-wrap:balance}
.app{min-height:100%}
main{max-width:720px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 18px 150px}

/* navegación */
#nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:20;display:flex;gap:2px;background:color-mix(in srgb,var(--surface) 80%,transparent);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);border:1px solid var(--line);border-radius:26px;padding:6px;box-shadow:var(--shadow)}
#nav .ti{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:11px;font-weight:500;color:var(--ink2);border-radius:10px}
#nav .ti svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#nav .ti.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,transparent)}
#nav .ti{border-radius:20px}
#nav .brand,#nav .only-wide{display:none}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;letter-spacing:-.02em;font-size:21px}
.logo svg{width:28px;height:28px;fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink2)}
.iconbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
@media (min-width:900px){
  .app{display:grid;grid-template-columns:248px 1fr}
  #nav{position:sticky;top:0;left:auto;right:auto;bottom:auto;height:100dvh;flex-direction:column;border:0;border-right:1px solid var(--line);border-radius:0;background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none;padding:30px 14px;gap:2px;align-self:start}
  #nav .brand{display:flex;margin:0 0 30px 10px}
  #nav .ti{flex:none;flex-direction:row;gap:12px;font-size:15px;padding:11px 12px;justify-content:flex-start}
  #nav .ti.on{background:var(--surface2);color:var(--ink)}
  #nav .only-wide{display:flex;margin-top:auto}
  .topbar{display:none}
  main{max-width:820px;padding:48px 44px 90px}
}

/* tipografía */
.big{font-family:var(--display);font-weight:600;font-size:clamp(52px,14vw,80px);line-height:1;letter-spacing:-.035em}
.h1,.ph h1{font-family:var(--display);font-weight:600;letter-spacing:-.02em;font-size:38px;line-height:1.05}
.h{font-family:var(--display);font-weight:600;letter-spacing:-.02em;font-size:22px;line-height:1.15}
.lab{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);font-weight:500}
.muted{color:var(--ink2)}
.small{font-size:14px}
.ph{margin-bottom:26px}.ph p{margin-top:6px;max-width:46ch}
section{margin-top:34px}
section:first-of-type{margin-top:0}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.hair{border:0;border-top:1px solid var(--line);margin:34px 0 0}

/* botones y enlaces */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:999px;font-weight:600;font-size:15px;transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 86%,#fff),var(--accent));color:var(--accent-ink);box-shadow:0 8px 18px -8px color-mix(in srgb,var(--accent) 70%,transparent),inset 0 1px 0 rgba(255,255,255,.18)}
.btn.line{border:1px solid var(--line)}
.link{color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:14px;font-weight:500}
.link.danger{color:var(--bad)}
.link.mute{color:var(--ink2)}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;text-align:center;padding:9px 6px;border-radius:9px;font-size:14px;color:var(--ink2);font-weight:500;transition:background .2s}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips.grid2{display:grid;grid-template-columns:1fr 1fr}
.chip{text-align:center;padding:9px 13px;border:1px solid var(--line);border-radius:999px;font-size:14px;color:var(--ink2)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* listas */
.rows{border-top:1px solid var(--line)}
.row{display:flex;width:100%;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.row .m b{font-weight:600;display:block}
.row .m small{color:var(--ink2);font-size:13px}
.row .a{font-weight:600;white-space:nowrap}
.empty{padding:18px 0;color:var(--ink2);border-bottom:1px solid var(--line)}
.tot{display:flex;justify-content:space-between;padding:14px 0 0;font-size:15px}
.tot b{font-family:var(--display);letter-spacing:-.02em;font-size:26px;font-weight:600}

/* hero */
.hero .lab{margin-bottom:8px}
.hero .sub{margin-top:14px;color:var(--ink2)}
.meter{height:5px;border-radius:3px;background:var(--surface2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .6s ease}
.meter.bad i{background:var(--bad)}.meter.warn i{background:var(--warn)}
.when{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:26px;padding-top:22px;border-top:1px solid var(--line)}
.when .v{font-family:var(--display);font-weight:600;letter-spacing:-.02em;font-size:30px;line-height:1.1;margin-top:4px;text-transform:capitalize}
.when .v.plain{text-transform:none}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.trio .v{font-family:var(--display);font-weight:600;letter-spacing:-.02em;font-size:28px;line-height:1.1;margin-top:4px}
.trio .v.neg{color:var(--bad)}
.trio .lab{white-space:nowrap;font-size:11px;letter-spacing:.05em;line-height:1.3}
.trio{align-items:start}
.trio .v{white-space:nowrap}

/* reparto del mes */
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;background:var(--surface2);margin:16px 0 4px}
.stack i{display:block;min-width:3px;transition:flex-grow .6s ease}
.leg{display:grid;grid-template-columns:12px 1fr auto;gap:0 12px;align-items:start;padding:13px 0;border-bottom:1px solid var(--line)}
.leg:first-of-type{border-top:1px solid var(--line)}
.dot{width:12px;height:12px;border-radius:4px;margin-top:5px}
.leg b{font-weight:600}
.leg small{display:block;color:var(--ink2);font-size:13px;line-height:1.35}
.leg .a{font-weight:600}

/* observaciones */
.ins{display:grid;grid-template-columns:36px 1fr;gap:14px;padding:16px 0;border-top:1px solid var(--line)}
.ins:first-child{border-top:0}
.ins .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--tone) 14%,transparent);color:var(--tone)}
.ins .ic svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.ins.good{--tone:var(--good)}.ins.warn{--tone:var(--warn)}.ins.bad{--tone:var(--bad)}.ins.info{--tone:var(--accent)}
.ins b{font-weight:600;display:block}
.ins p{color:var(--ink2);font-size:15px;margin-top:2px}

/* deudas */
.debt{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 18px 16px 22px;margin-top:12px;box-shadow:var(--shadow)}
.debt::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--rail,var(--accent))}

.debt .t{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.debt .t b{font-weight:600;font-size:17px}
.debt .t>span{font-family:var(--display);font-weight:600;letter-spacing:-.02em;font-size:26px}
.debt .meta{display:flex;gap:16px;flex-wrap:wrap;color:var(--ink2);font-size:14px;margin:4px 0 12px}
.debt .acts{display:flex;gap:10px;margin-top:14px}
.acts .btn{flex:1;padding:11px 14px;font-size:14px}
.sim{margin-top:6px}
.sim label{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}
.sim label b{font-family:var(--display);letter-spacing:-.02em;font-size:28px;font-weight:600}
input[type=range]{width:100%;margin:12px 0 4px;accent-color:var(--accent);height:28px}
.res{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px}
.res .v{font-family:var(--display);font-weight:600;letter-spacing:-.02em;font-size:30px;line-height:1.1;margin-top:4px}
.res .v.cap{text-transform:capitalize}
.note{margin-top:14px;font-size:15px;color:var(--ink2)}
.note b{color:var(--ink);font-weight:600}
.keys{display:flex;gap:18px;font-size:13px;color:var(--ink2);margin:22px 0 6px;flex-wrap:wrap}
.keys span{display:inline-flex;align-items:center;gap:7px}
.keys i{width:18px;height:0;border-top:2.5px solid var(--accent);display:inline-block}
.keys i.d{border-top:2px dashed var(--ink2)}
svg.chart{display:block;width:100%;height:auto;overflow:visible}
svg.chart text{fill:var(--ink2);font:500 11px var(--body)}
svg.chart .g{stroke:var(--line);stroke-width:1}
svg.chart .pl{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
svg.chart .pa{fill:var(--accent);opacity:.12}
svg.chart .bl{fill:none;stroke:var(--ink2);stroke-width:1.8;stroke-dasharray:5 5}
svg.chart .dt{fill:var(--accent);stroke:var(--bg);stroke-width:2.5}
svg.chart text.em{fill:var(--ink);font-weight:600;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.order{counter-reset:o}
.order .row{padding:11px 0}
.order .row .m b{font-weight:500}

/* gastos */
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.mnav .nm{font-family:var(--display);font-weight:600;letter-spacing:-.02em;font-size:24px;text-transform:capitalize}
.mnav button{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--ink2);font-size:22px}
.cat{display:grid;grid-template-columns:96px 1fr auto;gap:12px;align-items:center;padding:7px 0;font-size:14px}
.cat span:first-child{color:var(--ink2)}
.day{margin-top:22px;font-size:13px;color:var(--ink2);padding-bottom:6px}.day::first-letter{text-transform:uppercase}
.fab{position:fixed;right:20px;bottom:calc(100px + env(safe-area-inset-bottom));z-index:15;width:56px;height:56px;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.22)}
.fab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
@media (min-width:900px){.fab{bottom:34px;right:44px}}

/* otros */
.banner{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 14px;border:1px dashed var(--line);border-radius:12px;font-size:14px;color:var(--ink2);margin-bottom:24px}
.step{display:grid;grid-template-columns:28px 1fr auto;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);width:100%}
.step:first-of-type{border-top:1px solid var(--line)}
.step .n{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--ink2)}
.step.done .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step b{font-weight:600;display:block}
.step small{color:var(--ink2)}
.stack-btns{display:flex;flex-direction:column;align-items:stretch;gap:16px;margin-top:26px;text-align:center}
.stack-btns .btn{width:100%}
.stack-btns .link{align-self:center}
.stack-btns p{margin-left:auto;margin-right:auto}


/* premium */
.greet{font-size:28px;font-weight:600;letter-spacing:-.025em;line-height:1.1}
.gdate{color:var(--ink2);font-size:14px;margin:4px 0 20px}.gdate::first-letter{text-transform:uppercase}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.card.tight{padding:4px 20px}
.card .rows{border-top:0}
.card .row:last-child,.card .empty:last-child{border-bottom:0}
.card .tot{border-top:1px solid var(--line);padding:14px 0}
.card .trio{gap:0}
.trio>div+div{border-left:1px solid var(--line);padding-left:14px}
.hcard{position:relative;overflow:hidden;border-radius:28px;padding:22px 22px 20px;color:var(--hero-ink);background:radial-gradient(120% 90% at 100% 0%,rgba(222,184,100,.24),transparent 55%),linear-gradient(155deg,var(--hero1),var(--hero2));border:1px solid rgba(255,255,255,.07);box-shadow:0 28px 50px -22px rgba(6,34,40,.6),inset 0 1px 0 rgba(255,255,255,.1)}
.hcard::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.04) 0 1px,transparent 1px 16px);pointer-events:none}
.hcard>*{position:relative}
.hc-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hl{font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--hero-mute);font-weight:600}
.hchip{font-size:12px;padding:5px 12px;border-radius:999px;border:1px solid rgba(233,207,143,.45);color:#EBD598;font-weight:600;white-space:nowrap}
.hc-main{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-top:16px}
.hcard .big{color:#fff;font-size:clamp(44px,12.5vw,70px)}
.hcard.neg .big{color:#FFB9A8}
.hsub{color:var(--hero-mute);font-size:14px;margin-top:10px;max-width:34ch}
.ring{position:relative;width:92px;height:92px;flex:none}
.ring svg{width:100%;height:100%;display:block}
.rt{fill:none;stroke:rgba(255,255,255,.13);stroke-width:8}
.rv{fill:none;stroke:url(#rg);stroke-width:8;stroke-linecap:round}
.rc{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.rc b{font-size:20px;font-weight:700;line-height:1;letter-spacing:-.02em}
.rc small{font-size:9.5px;color:var(--hero-mute);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.spark{display:block;width:100%;height:64px;margin-top:20px}
.hfoot{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.15)}
.hfoot .v{font-size:24px;font-weight:600;letter-spacing:-.02em;margin-top:4px;line-height:1.15;text-transform:capitalize}
.hfoot.three{grid-template-columns:repeat(3,1fr);gap:10px}
.hfoot.three .v{font-size:19px}
.hmeter{height:6px;border-radius:3px;background:rgba(255,255,255,.14);margin-top:20px;overflow:hidden}
.hmeter i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#EBD598,#C49A3C);transition:width .7s ease}
.hmeter.over i{background:linear-gradient(90deg,#FFB9A8,#F08A74)}
.alloc{display:grid;gap:12px;justify-items:center}
.alloc .legs{width:100%}
.donut{position:relative;width:188px;height:188px}
.donut svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.dc{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.dc b{font-size:28px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.dc small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
@media (min-width:700px){.alloc{grid-template-columns:200px 1fr;align-items:center;justify-items:stretch;gap:26px}.donut{justify-self:center}}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 50%,transparent);padding:3px 9px;border-radius:999px;margin-left:8px;vertical-align:2px}
.card .seg{margin:0}
.row:active,.step:active{opacity:.65}
.row.done{opacity:.55}
.tag.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 50%,transparent)}
.tag.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.tag.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.chip.act{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent);font-weight:600}
.row .a.pos{color:var(--good)}.row .a.neg{color:var(--bad)}
.fresh>*:not(.fab){animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.fresh>*:nth-child(2){animation-delay:.05s}.fresh>*:nth-child(3){animation-delay:.1s}.fresh>*:nth-child(4){animation-delay:.15s}.fresh>*:nth-child(5){animation-delay:.2s}.fresh>*:nth-child(6){animation-delay:.25s}.fresh>*:nth-child(n+7){animation-delay:.3s}
.fresh .donut svg{animation:sweep 1s cubic-bezier(.2,.7,.2,1) both .1s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes sweep{from{transform:rotate(-170deg);opacity:0}to{transform:rotate(-90deg);opacity:1}}

<div class="app">

      <button class="iconbtn" data-tab="ajustes" aria-label="Ajustes"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>

<script>
(function(){
'use strict';

/* ---------- utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const sum=(a,k='amount')=>a.reduce((t,x)=>t+(+x[k]||0),0);
const fmt=n=>(n<0?'−':'')+'$'+Math.abs(Math.round(n)).toLocaleString('en-US');
const fmt2=n=>(n<0?'−':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=r=>String(+(+r).toFixed(2))+'%';
function num(v){
  let s=String(v==null?'':v).trim().replace(/[^\d.,-]/g,'');
  if(!s) return 0;
  if(s.includes(',')&&s.includes('.')) s=s.replace(/,/g,'');
  else if(/^-?\d{1,3}(,\d{3})+$/.test(s)) s=s.replace(/,/g,'');
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
  else s=s.replace(',','.');
  const n=parseFloat(s); return isFinite(n)?n:0;
}
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const ym=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const ymd=(d=new Date())=>ym(d)+'-'+String(d.getDate()).padStart(2,'0');
const monthName=k=>{const [y,m]=k.split('-');return MESES[+m-1]+' '+y;};
const shiftMonth=(k,n)=>{const [y,m]=k.split('-').map(Number);return ym(new Date(y,m-1+n,1));};
const afterMonths=n=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+Math.max(0,n));return MESES[d.getMonth()]+' '+d.getFullYear();};
const span=n=>{const y=Math.floor(n/12),m=n%12,p=[];if(y)p.push(y+(y===1?' año':' años'));if(m)p.push(m+(m===1?' mes':' meses'));return p.join(' y ')||'menos de un mes';};
const dayLabel=s=>{const [y,m,d]=s.split('-').map(Number);const dt=new Date(y,m-1,d);return DIAS[dt.getDay()]+' '+d+' de '+MESES[m-1];};

/* ---------- estado ---------- */
const KEY='norte.v1';
const PLANS={
  suave:{n:'Con aire',debt:.4,save:.2,pers:.4,d:'Paga la deuda sin ahogarte. Más margen para vivir.'},
  equilibrado:{n:'Equilibrado',debt:.6,save:.15,pers:.25,d:'El punto medio: avanzas rápido y te queda margen.'},
  fondo:{n:'A fondo',debt:.75,save:.1,pers:.15,d:'Máximo esfuerzo. Terminas antes, con poco margen.'}
};
const CATS=['Comida fuera','Transporte','Ocio','Compras','Salud','Hogar','Otros'];
const DEF=()=>({name:'Sebas',theme:'auto',incomes:[],essentials:[],debts:[],payments:[],expenses:[],
  goals:[{id:'emg',name:'Fondo de emergencia',saved:0,target:0,auto:true}],plan:'equilibrado',strategy:'avalancha',demo:false,accounts:[],moves:[],paid:{},open:{}});
let S=DEF();
try{const raw=localStorage.getItem(KEY);if(raw){S=Object.assign(DEF(),JSON.parse(raw));}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const V={tab:'inicio',month:ym(),sim:null};

/* ---------- motor financiero ---------- */
function lumpIdx(d){
  if(!d.graceUntil)return 0;
  const [y,m]=d.graceUntil.split('-').map(Number),n=new Date();
  const k=(y*12+(m-1))-(n.getFullYear()*12+n.getMonth())+1;
  return k>=1?k:0;
}
function simulate(debts,extra,strategy){
  const ds=debts.filter(d=>d.balance>0.005).map(d=>({name:d.name,b:d.balance,r:d.rate/1200,m:+d.min||0,rate:d.rate,kl:lumpIdx(d),lump:+d.lump||0,acc:0}));
  const out={months:0,interest:0,order:[],ok:true,series:[ds.reduce((t,d)=>t+d.b,0)]};
  if(!ds.length) return out;
  let freed=0,n=0;
  while(ds.some(d=>d.b>0.005)&&n<600){
    n++;
    let pool=extra+freed;
    ds.forEach(d=>{
      if(d.b<=0.005)return;
      const i=d.b*d.r;
      if(d.kl&&n<d.kl){d.acc+=i;return;}
      if(d.kl&&n===d.kl){out.interest+=(d.lump>0?d.lump:d.acc+i);d.acc=0;return;}
      d.b+=i;out.interest+=i;
      const q=Math.min(d.m,d.b);d.b-=q;pool+=d.m-q;
    });
    const pri=ds.filter(d=>d.b>0.005).sort(strategy==='avalancha'?(a,b)=>b.rate-a.rate||a.b-b.b:(a,b)=>a.b-b.b);
    for(const d of pri){if(pool<=0.005)break;const q=Math.min(pool,d.b);d.b-=q;pool-=q;}
    ds.forEach(d=>{if(d.b<=0.005&&!d.done){d.done=true;d.b=0;freed+=d.m;out.order.push({name:d.name,month:n});}});
    out.series.push(ds.reduce((t,d)=>t+d.b,0));
  }
  out.months=n;out.ok=!ds.some(d=>d.b>0.005);
  return out;
}
function calc(){
  const I=sum(S.incomes),E=sum(S.essentials);
  const active=S.debts.filter(d=>d.balance>0.005);
  const Mfull=sum(active,'min');
  const M=active.reduce((t,d)=>t+(lumpIdx(d)>=1?0:(+d.min||0)),0);
  const free=I-E-M;
  const freeA=I-E-Mfull,graceNow=M<Mfull;
  const liquid=sum(S.accounts.filter(a=>a.type==='banco'||a.type==='efectivo'),'balance');
  const P=PLANS[S.plan]||PLANS.equilibrado;
  let extra=0,savings=0,pers=0,lumpSave=0;
  const lumpDs=active.filter(d=>lumpIdx(d)>=1&&d.lump>0);
  if(lumpDs.length&&free>0){
    const months=Math.max(Math.min.apply(null,lumpDs.map(lumpIdx))-1,1);
    lumpSave=Math.min(Math.round(Math.max(0,(sum(lumpDs,'lump')-liquid)/months)),Math.round(free));
  }
  const rem=free-lumpSave;
  if(rem>0){
    if(active.length){
      const maxExtra=graceNow?Math.max(0,Math.round(freeA)):Infinity;
      extra=Math.min(Math.round(rem*P.debt),maxExtra);
      pers=Math.round(rem*P.pers);
      savings=Math.max(0,Math.round(rem)-extra-pers);
    }else{savings=Math.round(rem*.5);pers=Math.round(rem)-savings;}
  }
  const debtTotal=sum(active,'balance');
  const initial=sum(S.debts,'initial');
  const paid=Math.max(0,initial-debtTotal);
  const intM=active.reduce((a,d)=>a+d.balance*d.rate/1200,0);
  const plan=simulate(S.debts,extra,S.strategy);
  const base=simulate(S.debts,0,S.strategy);
  const spent=sum(S.expenses.filter(x=>x.date.slice(0,7)===V.month&&!x.fixedId));
  const invested=sum(S.accounts.filter(a=>a.type==='inversion'),'balance');
  const stored=sum(S.accounts,'balance');
  const cushion=active.length?(E+Mfull):E*3;
  const locked=sum(S.accounts.filter(a=>a.type==='bloqueada'),'balance');
  const lks=active.map(lumpIdx).filter(k=>k>=1);
  const reserve=sum(active.filter(d=>lumpIdx(d)>=1),'lump')+(lks.length?Math.max(0,-free)*(Math.min.apply(null,lks)-1):0);
  const excess=Math.max(0,liquid-cushion-reserve);
  return {lumpSave,reserve,Mfull,locked,I,E,M,free,extra,savings,pers,active,debtTotal,initial,paid,intM,plan,base,spent,liquid,invested,stored,cushion,excess,net:stored-debtTotal};
}
function priority(){
  const a=S.debts.filter(d=>d.balance>0.005);
  return a.sort(S.strategy==='avalancha'?(x,y)=>y.rate-x.rate||x.balance-y.balance:(x,y)=>x.balance-y.balance)[0];
}
const isDebtIns=i=>!!i.k||/deuda|interes|Tasa alta|pagarás|abonar/i.test(i.h);
function insights(c){
  const L=[];
  if(!c.I){L.push({t:'info',h:'Falta tu ingreso',p:'Añade tu sueldo en Mi dinero y calculo el plan completo.'});return L;}
  if(c.free<0){
    const top=[...S.essentials].sort((a,b)=>b.amount-a.amount).slice(0,2).map(x=>x.name).join(' y ');
    L.push({t:'bad',h:'Te faltan '+fmt(-c.free)+' al mes',p:'Tus esenciales y los pagos mínimos suman '+fmt(c.E+c.M)+' y entran '+fmt(c.I)+'. Hay que cerrar esa brecha'+(top?': revisa '+top+',':'')+' o suma ingresos. Mientras no se cierre, cada mes pierdes dinero.'});
  }else if(c.active.length){
    const p=priority();
    L.push({t:'good',h:'Manda '+fmt(c.extra)+' extra a la deuda cada mes',p:'Va encima de los mínimos ('+fmt(c.M)+'). Todo el extra es para '+p.name+(S.strategy==='avalancha'?', porque cobra la tasa más alta ('+pct(p.rate)+').':', la más pequeña, para cerrarla pronto y liberar su cuota.')});
  }
  if(c.active.length){
    if(!c.plan.ok) L.push({t:'bad',h:'Los pagos no cubren los intereses',p:'Con lo que pagas hoy la deuda crece o se estanca. Sube la cuota o el extra hasta que el plan llegue a cero.'});
    else if(c.intM>0) L.push({t:c.intM>=c.M*.8?'warn':'info',h:fmt(c.intM)+' al mes se van en intereses',p:'Es lo que cuesta tener la deuda. Cada dólar extra que abonas baja esa cifra.'});
    if(c.I>0){
      const m=c.debtTotal/c.I;
      L.push({t:m>18?'warn':'info',h:'Tu deuda equivale a '+Math.round(m)+' meses de ingreso',p:'Cuanto más baja esa cifra, más aire tienes. El plan la reduce mes a mes.'});
    }
    const hi=c.active.filter(d=>d.rate>=20);
    if(hi.length) L.push({t:'warn',h:'Tasa alta en '+hi.map(d=>d.name).join(' y '),p:'Pregunta en el banco si puedes refinanciar o pasar ese saldo a una tasa menor. Con menos interés terminas antes sin poner más dinero.'});
  }
  if(c.I>0&&c.E/c.I>.55) L.push({t:'warn',h:'Tus esenciales ocupan el '+Math.round(c.E/c.I*100)+'% del ingreso',p:'La regla 50/30/20 sugiere cerca del 50%. Recortar '+fmt(c.E-c.I*.5)+' ahí te da más margen.'});
  if(c.active.length&&c.plan.ok&&c.plan.interest>c.debtTotal*.5)L.push({t:'warn',h:'En total pagarás '+fmt(c.plan.interest)+' de intereses',p:'Son '+(c.plan.interest/c.debtTotal).toFixed(1)+' veces lo que debes hoy. Cada abono extra a capital, o una tasa menor, baja esa cifra.'});
  const emg=S.goals.find(g=>g.auto);
  const emgSaved=S.accounts.length?c.liquid:(emg?emg.saved:0);
  if(emg&&c.E>0&&emgSaved<c.E&&c.free>=0) L.push({t:'info',h:'Arma un colchón de '+fmt(c.E),p:'Un mes de esenciales evita que una emergencia te devuelva a las tarjetas. Hoy tienes '+fmt(emgSaved)+'.'});
  strat(c).filter(i=>i.k).forEach((i,ix)=>L.splice(1+ix,0,i));
  lumpInsights(c).forEach((i,ix)=>L.splice(ix,0,i));
  if(c.lumpSave>0){const k=Math.min.apply(null,c.active.map(lumpIdx).filter(x=>x>=1));L.splice(0,0,{t:'good',h:'Aparta '+fmt(c.lumpSave)+' al mes para tu pago de '+afterMonths(k-1),p:'Es lo que debes guardar cada mes para llegar a ese pago con tus ahorros de hoy. El resto del plan sale de lo que sobra.'});}
  return L;
}

/* ---------- estrategia de ahorros ---------- */
function lumpInsights(c){
  const out=[];
  c.active.forEach(d=>{
    const kl=lumpIdx(d);
    if(kl<1||!(d.lump>0))return;
    const months=Math.max(kl-1,0),when=afterMonths(kl-1);
    const have=c.liquid+c.free*months,gap=d.lump-have;
    if(gap>0){
      const per=months>0?gap/months:gap;
      let p='Hoy tienes '+fmt(c.liquid)+' disponibles y '+(c.free<0?'cada mes te faltan '+fmt(-c.free):'cada mes te quedan '+fmt(c.free))+', así que llegarías con '+fmt(Math.max(have,0))+'. Te faltan '+fmt(gap)+': son unos '+fmt(per)+' más al mes desde ahora.';
      if(c.locked>0)p+=' Si el banco aplica tu garantía ('+fmt(c.locked)+') a ese pago, el faltante baja a '+fmt(Math.max(0,gap-c.locked))+'.';
      out.push({k:'lump',t:'bad',h:'Pago grande de '+fmt(d.lump)+' en '+when,p});
    }else out.push({k:'lump',t:'good',h:'Pago grande de '+fmt(d.lump)+' en '+when+': cubierto',p:'Con tu ritmo actual llegarás con '+fmt(have)+'. Guárdalo aparte para no gastarlo.'});
    if(c.I>0)out.push({k:'lump',t:'warn',h:'Desde '+afterMonths(kl)+' pagas '+fmt(d.min)+' al mes',p:'Con tus esenciales de '+fmt(c.E)+', necesitas ganar unos '+fmt(c.E+c.Mfull)+' al mes (hoy entran '+fmt(c.I)+').'});
  });
  return out;
}

function lumpEffect(c,amt){
  const p=priority();if(!p||amt<=0)return null;
  const use=Math.min(amt,p.balance);
  const ds=S.debts.map(d=>d.id===p.id?Object.assign({},d,{balance:d.balance-use}):d);
  const after=simulate(ds,c.extra,S.strategy);
  return {use,debt:p,months:c.plan.months-after.months,interest:c.plan.interest-after.interest,after};
}
function strat(c){
  const L=[];
  if(!S.accounts.length){L.push({t:'info',h:'Registra lo que ya tienes guardado',p:'Con tus cuentas te digo cuánto dejar de colchón y cuánto usar contra la deuda.'});return L;}
  if(c.locked>0)L.push({k:'lock',t:'info',h:fmt(c.locked)+' están bloqueados como garantía',p:'No cuentan como disponibles. Pregunta al banco si puedes aplicarlos al capital o al pago grande, y cuándo se liberan.'});
  const fixed=c.E+c.Mfull;
  if(fixed>0){const mo=c.liquid/fixed;L.push({t:mo<1?'warn':'good',h:'Tu dinero disponible cubre '+mo.toFixed(1)+' meses de gastos fijos',p:mo<1?'Antes de abonar de golpe a la deuda, completa al menos un mes ('+fmt(fixed)+') en banco y efectivo.':'Es lo que tienes en banco y efectivo frente a tus gastos fijos y cuotas del mes.'});}
  if(c.active.length&&c.excess>0){
    const e=lumpEffect(c,c.excess);
    if(e)L.push({k:'abono',t:'good',h:'Puedes abonar '+fmt(e.use)+' de golpe a '+e.debt.name,p:'Dejas '+fmt(c.cushion+c.reserve)+' de reserva (colchón, déficit y pagos grandes que vienen) y el resto ataca la deuda que cobra '+pct(e.debt.rate)+'. '+(c.plan.ok?'Ahorras '+fmt(e.interest)+' en intereses y terminas '+span(Math.max(0,e.months))+' antes.':'Con eso el plan ya llega a cero.')});
  }
  const inv=S.accounts.filter(a=>a.type==='inversion'&&a.balance>0);
  if(inv.length&&c.active.length){
    const top=c.active.slice().sort((a,b)=>b.rate-a.rate)[0];
    const best=Math.max.apply(null,[0].concat(inv.map(a=>a.rate||0)));
    if(best>0&&best<top.rate)L.push({k:'inv',t:'warn',h:'Tu inversión rinde menos que tu deuda',p:'Rinde '+pct(best)+' y '+top.name+' te cuesta '+pct(top.rate)+'. Abonar a esa deuda equivale a ganar '+pct(top.rate)+' sin riesgo. Evalúa liberar parte de la inversión.'});
    else if(best>=top.rate&&best>0)L.push({k:'inv',t:'info',h:'Tu inversión rinde más que la tasa de tu deuda',p:'Rinde '+pct(best)+' frente a '+pct(top.rate)+'. Si esa rentabilidad es real y estable, puede convenir mantenerla. Pesa también el riesgo.'});
    else L.push({t:'info',h:'Añade el rendimiento de tu inversión',p:'Con su rendimiento anual comparo si conviene invertir o pagar deuda. Tu deuda más cara cobra '+pct(top.rate)+'.'});
  }
  if(!c.active.length&&c.excess>0)L.push({t:'info',h:'Tienes '+fmt(c.excess)+' por encima del colchón',p:'Sin deudas, ese excedente puede ir a inversión o a tus metas.'});
  return L;
}

/* ---------- revisión del mes ---------- */
function monthData(k){
  const ex=S.expenses.filter(x=>x.date.slice(0,7)===k&&!x.fixedId);
  const by={},nm={};
  ex.forEach(x=>{by[x.cat]=(by[x.cat]||0)+x.amount;const n=x.name.trim().toLowerCase();if(!nm[n])nm[n]={n:x.name.trim(),c:0,t:0};nm[n].c++;nm[n].t+=x.amount;});
  return {ex,total:sum(ex),by,names:Object.values(nm),dep:sum(S.moves.filter(m=>m.kind==='dep'&&m.date.slice(0,7)===k),'amount'),paid:sum(S.payments.filter(q=>q.date.slice(0,7)===k),'amount')};
}
function review(c){
  const k=V.month,cur=monthData(k),prev=monthData(shiftMonth(k,-1)),now=k===ym(),items=[];let verdict=null;
  if(!cur.ex.length&&!cur.dep&&!cur.paid) return {verdict:null,items:[{t:'info',h:'Aún no hay datos de este mes',p:'Anota tus gastos y depósitos y aquí te digo cómo vas y qué ajustar.'}]};
  const top=Object.entries(cur.by).sort((a,b)=>b[1]-a[1])[0];
  if(c.pers>0){
    const r=cur.total/c.pers,left=c.pers-cur.total;
    if(r>1){verdict={t:'bad',l:'Te pasaste'};items.push({t:'bad',h:'Te pasaste '+fmt(-left)+' del presupuesto',p:'Ese dinero sale de lo que iba a la deuda o al ahorro.'+(top?' Frena '+top[0].toLowerCase()+' ('+fmt(top[1])+') el resto del mes.':'')});}
    else if(r>.8){verdict={t:'warn',l:'Ajustado'};items.push({t:'warn',h:'Llevas el '+Math.round(r*100)+'% de tu presupuesto',p:'Te quedan '+fmt(left)+'. Cuida los gastos pequeños.'});}
    else{
      verdict={t:'good',l:'Buen mes'};
      let p='Gastaste '+fmt(cur.total)+' de '+fmt(c.pers)+'.';
      const pr=priority();
      if(left>=10&&pr){const e=c.plan.ok?lumpEffect(c,left):null;p+=' Muévelos al ahorro o abónalos a '+pr.name+'.'+(e&&e.interest>1?' Abonando '+fmt(e.use)+' ahorras '+fmt(e.interest)+' en intereses.':'');}
      items.push({t:'good',h:'Te '+(now?'sobran por ahora ':'sobraron ')+fmt(left),p});
    }
    if(now){
      const d=new Date(),day=d.getDate(),dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
      if(day>=5){const proj=cur.total/day*dim;if(proj>c.pers*1.05&&r<=1)items.push({t:'warn',h:'A este ritmo cerrarás en '+fmt(proj),p:'Tu presupuesto es '+fmt(c.pers)+'. Baja el ritmo para no pasarte a fin de mes.'});}
    }
  }
  if(c.savings>0){
    const late=!now||new Date().getDate()>=20;
    if(cur.dep>=c.savings) items.push({t:'good',h:'Cumpliste tu ahorro del mes',p:'Depositaste '+fmt(cur.dep)+' y tu meta era '+fmt(c.savings)+'.'});
    else if(cur.dep===0||late) items.push({t:'warn',h:cur.dep?'Ahorraste '+fmt(cur.dep)+' de '+fmt(c.savings):'Este mes no has ahorrado nada',p:'Tu meta es '+fmt(c.savings)+'. Deposítalo apenas cobres, antes de gastar, y lo que quede es para vivir.'});
  }
  if(cur.paid>0) items.push({t:'good',h:'Pagaste '+fmt(cur.paid)+' a tus deudas',p:'Cada pago baja la deuda y los intereses del mes siguiente.'});
  if(top&&cur.total>0&&top[1]/cur.total>.4&&Object.keys(cur.by).length>1) items.push({t:'info',h:Math.round(top[1]/cur.total*100)+'% de tus gastos son de '+top[0].toLowerCase(),p:'Es tu mayor categoría del mes ('+fmt(top[1])+'). Ahí está lo que más rinde recortar.'});
  Object.keys(cur.by).forEach(cat=>{const a=cur.by[cat],b=prev.by[cat]||0;if(b>0&&a>b*1.3&&a-b>=15)items.push({t:'warn',h:'Subiste en '+cat.toLowerCase()+': +'+fmt(a-b),p:'El mes pasado fueron '+fmt(b)+' y este mes '+fmt(a)+'.'});});
  cur.names.filter(x=>x.c>=3&&x.t>=20).sort((a,b)=>b.t-a.t).slice(0,1).forEach(x=>items.push({t:'info',h:'Gastas '+fmt(x.t)+' en "'+x.n+'" ('+x.c+' veces)',p:'Si lo reduces a la mitad liberas '+fmt(x.t/2)+' al mes para tu deuda.'}));
  return {verdict,items:items.slice(0,6)};
}
function buyResult(a,name){
  const c=calc(),spentNow=sum(S.expenses.filter(x=>x.date.slice(0,7)===ym()&&!x.fixedId)),left=c.pers-spentNow,what=name?esc(name):'Esa compra';
  if(c.pers<=0) return insHTML({t:'info',h:'Primero completa tu plan',p:'Necesito tu ingreso, esenciales y deudas para saber cuánto puedes gastar.'});
  if(a<=left) return insHTML({t:'good',h:what+' cabe en tu presupuesto',p:'Te quedarían '+fmt(left-a)+' para el resto del mes.'});
  const over=a-Math.max(left,0);
  let p='Te pasas por '+fmt(over)+'. Ese dinero saldría de lo que iba a la deuda.';
  const pr=priority();
  if(pr&&c.plan.ok){
    const ds=S.debts.map(d=>d.id===pr.id?Object.assign({},d,{balance:d.balance+over}):d);
    const after=simulate(ds,c.extra,S.strategy),dm=after.months-c.plan.months,di=after.interest-c.plan.interest;
    p+=' Te cuesta '+fmt(di)+' extra en intereses'+(dm>0?' y retrasa '+span(dm)+' tu libertad de deudas':'')+'.';
  }
  p+=' Si no es urgente, espera al próximo mes o junta el dinero para pagarlo sin deuda.';
  return insHTML({t:over>a*.5?'bad':'warn',h:'Mejor espera con '+what.toLowerCase(),p});
}

function sparkSVG(series){
  const n=series.length;if(n<2)return '';
  const step=Math.max(1,Math.ceil(n/60)),pts=[];
  for(let i=0;i<n;i+=step)pts.push(series[i]);

  const mx=Math.max.apply(null,pts.concat([1]));
  const d=pts.map((v,i)=>(i?'L':'M')+(i/(pts.length-1)*300).toFixed(1)+' '+(4+(1-v/mx)*52).toFixed(1)).join('');
  return '<svg class="spark" viewBox="0 0 300 64" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EBD598" stop-opacity=".38"/><stop offset="1" stop-color="#EBD598" stop-opacity="0"/></linearGradient></defs><path d="'+d+'L300 64L0 64Z" fill="url(#sg)"/><path d="'+d+'" fill="none" stroke="#EBD598" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>';

function chartSVG(plan,base){
  const W=Math.max(300,Math.min($('#main').clientWidth,820)-(innerWidth>=900?132:80)),Hh=230,pl=50,pr=12,pt=16,pb=30,iw=W-pl-pr,ih=Hh-pt-pb;
  const H=Math.min(Math.max(plan.ok?(base.ok?Math.max(plan.months,base.months):Math.ceil(plan.months*1.5)):120,6),480);
  const max=Math.max(plan.series[0]||1,1);
  const X=i=>pl+i/H*iw, Y=v=>pt+(1-Math.min(Math.max(v,0),max)/max)*ih;
  const val=(s,i,okEnd)=>i<s.length?s[i]:(okEnd?0:s[s.length-1]);
  const line=(s,okEnd)=>{let d='';for(let i=0;i<=H;i++)d+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(val(s,i,okEnd)).toFixed(1);return d;};
  let g='';
  [0,.5,1].forEach(t=>{const y=pt+t*ih;g+='<line class="g" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(pl-8)+'" y="'+(y+4)+'" text-anchor="end">'+fmt(max*(1-t))+'</text>';});
  const pPath=line(plan.series,plan.ok);
  let s='<svg class="chart" viewBox="0 0 '+W+' '+Hh+'" role="img" aria-label="Deuda restante mes a mes">'+g;
  s+='<path class="pa" d="'+pPath+' L'+X(H).toFixed(1)+' '+(pt+ih)+' L'+pl+' '+(pt+ih)+'Z"/>';
  s+='<path class="bl" d="'+line(base.series,base.ok)+'"/><path class="pl" d="'+pPath+'"/>';
  if(plan.ok){
    const ex=X(plan.months),ey=pt+ih,anchor=plan.months/H>.8?'end':'middle';
    s+='<circle class="dt" cx="'+ex.toFixed(1)+'" cy="'+ey+'" r="5"/><text class="em" x="'+ex.toFixed(1)+'" y="'+(ey-16)+'" text-anchor="'+anchor+'" style="text-transform:capitalize">'+afterMonths(plan.months-1)+'</text>';
  }
  s+='<text x="'+pl+'" y="'+(Hh-6)+'">Hoy</text><text x="'+(W-pr)+'" y="'+(Hh-6)+'" text-anchor="end" style="text-transform:capitalize">'+afterMonths(H-1)+'</text></svg>';
  return s;
}
function planBlock(extra){

  let note='';

  if(!plan.ok) note=noCuota?'Una de tus deudas no tiene cuota registrada. Ponla en Editar para calcular el plan.':'Con este extra la deuda no llega a cero. Sube el pago hasta que lo haga.';

}

      '<p class="small muted" style="margin-top:10px">'+(S.strategy==='avalancha'?'Primero la deuda con la tasa más alta. Es la que menos intereses te cuesta.':'Primero la deuda más pequeña. Cierras cuentas rápido y eso motiva.')+'</p>'+
      '<div class="sim" style="margin-top:24px"><label for="simR"><span>Pago extra al mes</span><b id="simV">'+fmt(V.sim)+'</b></label><input type="range" id="simR" min="0" max="'+mx+'" step="10" value="'+Math.min(V.sim,mx)+'"><p class="small muted">Mueve la barra para ver qué pasa. El plan sugerido es '+fmt(c.extra)+'.</p></div>'+

  else h+=S.debts.slice().sort((a,b)=>(b.balance>0)-(a.balance>0)||b.rate-a.rate).map(d=>{
    const done=d.balance<=0.005,pc=d.initial>0?Math.min(100,(d.initial-d.balance)/d.initial*100):0;
    const rail=done?'var(--good)':d.rate>=20?'var(--bad)':d.rate>=10?'var(--warn)':'var(--good)';
    return '<div class="debt" style="--rail:'+rail+'"><div class="t"><b>'+esc(d.name)+(pr&&pr.id===d.id&&S.debts.filter(x=>x.balance>0.005).length>1?'<span class="tag">Prioridad</span>':'')+'</b><span>'+(done?'Saldada':fmt(d.balance))+'</span></div>'+
      '<div class="meta"><span>Tasa '+pct(d.rate)+' anual</span><span>Cuota '+fmt(d.min)+'</span><span>Inicial '+fmt(d.initial)+'</span>'+(lumpIdx(d)>=1?'<span>Sin cuota hasta '+afterMonths(lumpIdx(d)-1)+(d.lump?' · pago grande '+fmt(d.lump):'')+'</span>':'')+'</div>'+
      '<div class="meter"><i style="width:'+pc.toFixed(1)+'%"></i></div>'+
      '<div class="acts">'+(done?'':'<button class="btn primary" data-act="pay-debt" data-id="'+d.id+'">Registrar pago</button>')+'<button class="btn line" data-act="edit-debt" data-id="'+d.id+'">Editar</button></div></div>';
  }).join('');
  h+='</section>';
  const pays=S.payments.slice(-5).reverse();
  if(pays.length) h+='<section><div class="sec"><h2 class="h">Últimos pagos</h2></div><div class="card tight"><div class="rows">'+pays.map(p=>'<div class="row"><span class="m"><b>'+esc(p.name)+'</b><small>'+dayLabel(p.date)+'</small></span><span class="a">'+fmt2(p.amount)+'</span></div>').join('')+'</div></div></section>';
  return h;
}

  else{let last='';h+=list.map(x=>{let s='';if(x.date!==last){s='<div class="day">'+dayLabel(x.date)+'</div>';last=x.date;}return s+row('edit-exp',x.id,x.name,x.fixedId?'Gasto fijo · '+((S.essentials.find(y=>y.id===x.fixedId)||{}).name||''):x.cat,fmt2(x.amount));}).join('');}
  h+='</div></section><button class="fab" data-act="add-exp" aria-label="Añadir gasto"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>';

  let h=demoBanner()+heroCard({label:'Patrimonio neto',chip:emgAuto?'Guardado '+fmt(c.stored):'',val:c.net,neg:c.net<0,
    sub:emgAuto?'Lo que tienes guardado menos lo que debes.':'Registra tu dinero guardado y te muestro tu patrimonio real.',
    three:true,foot:emgAuto?hv('Disponible',fmt(c.liquid),true)+hv('Bloqueado',fmt(c.locked),true)+hv('Invertido',fmt(c.invested),true):''});
  const acc=S.accounts.map(a=>row('edit-acc',a.id,a.name,typeLabel(a.type)+(a.type==='inversion'&&a.rate?' · rinde '+pct(a.rate)+' anual':''),fmt(a.balance))).join('');
  h+='<section><div class="sec"><h2 class="h">Mi dinero guardado</h2><button class="link" data-act="add-acc">Añadir cuenta</button></div><div class="card tight"><div class="rows">'+(acc||empty('Añade dónde tienes tu dinero: banco, efectivo, inversiones.'))+'</div>'+
    (emgAuto?'<div class="tot"><span class="muted">Total guardado</span><b>'+fmt(c.stored)+'</b></div>':'')+'</div>'+
    (emgAuto?'<div class="chips grid2" style="margin-top:16px"><button class="chip act" data-act="dep">Depositar</button><button class="chip act" data-act="wd">Retirar</button><button class="chip act" data-act="mv">Mover entre cuentas</button><button class="chip act" data-act="payd">Abonar a una deuda</button></div>':'')+'<div class="stack-btns" style="margin-top:14px"><button class="btn line" data-act="cash">¿Qué hago con dinero nuevo?</button></div></section>';
  h+='<section><div class="sec"><h2 class="h">Estrategia</h2></div><div class="card tight">'+strat(c).map(insHTML).join('')+'</div><p class="small muted" style="margin-top:10px;max-width:52ch">Orientación basada en tus números. No sustituye a un asesor financiero regulado.</p></section>';
  h+='<section><div class="sec"><h2 class="h">Ahorro del mes</h2></div><div class="card"><div class="trio" style="grid-template-columns:1fr 1fr"><div><div class="lab">Sugerido al mes</div><div class="v">'+fmt(c.savings+c.lumpSave)+'</div></div><div><div class="lab">Plan</div><div class="v" style="font-size:20px;padding-top:6px">'+PLANS[S.plan].n+'</div></div></div><p class="small muted" style="margin-top:12px">'+(c.savings+c.lumpSave>0?'Sale del reparto de tu mes. Ajusta la intensidad en Inicio.':'Aparece cuando tu ingreso cubre esenciales y mínimos.')+'</p></div></section>';
  h+='<section><div class="sec"><h2 class="h">Mis metas</h2><button class="link" data-act="add-goal">Añadir meta</button></div>';
  h+=goals.map(({g,target,saved})=>{
    const pc=target>0?Math.min(100,saved/target*100):0,left=Math.max(0,target-saved),lock=g.auto&&emgAuto;
    let eta='';
    if(target>0&&left>0&&alloc>0){eta='<span>Lista en '+span(Math.ceil(left/alloc))+'</span>';alloc=0;}
    else if(target>0&&left<=0) eta='<span>Meta cumplida</span>';
    return '<div class="debt" style="--rail:var(--gold)"><div class="t"><b>'+esc(g.name)+'</b><span>'+fmt(saved)+'</span></div><div class="meta"><span>'+(g.auto&&target===0?'Define tus esenciales para calcular la meta':'Meta '+fmt(target)+(g.auto?' (1 mes de esenciales)':''))+'</span>'+eta+(lock?'<span>Usa tu banco y efectivo</span>':'')+'</div><div class="meter"><i style="width:'+pc.toFixed(1)+'%"></i></div>'+
      '<div class="acts">'+(lock?'':'<button class="btn primary" data-act="fund-goal" data-id="'+g.id+'">Aportar</button>')+'<button class="btn line" data-act="edit-goal" data-id="'+g.id+'">Editar</button></div></div>';
  }).join('')+'</section>';
  const mv=S.moves.slice(-6).reverse();
  if(mv.length) h+='<section><div class="sec"><h2 class="h">Movimientos recientes</h2></div><div class="card tight"><div class="rows">'+mv.map(m=>{
    const lab=m.kind==='dep'?'Depósito en '+m.acc:m.kind==='wd'?'Retiro de '+m.acc:m.kind==='mv'?m.acc+' → '+m.to:'Abono a '+m.debt+' desde '+m.acc;
    const sign=m.kind==='dep'?'+':m.kind==='mv'?'':'−',cls=m.kind==='dep'?'pos':m.kind==='mv'?'':'neg';
    return '<div class="row"><span class="m"><b>'+esc(lab)+'</b><small>'+dayLabel(m.date)+(m.note?' · '+esc(m.note):'')+'</small></span><span class="a '+cls+'">'+sign+fmt2(m.amount)+'</span></div>';
  }).join('')+'</div></div></section>';
  return h;
}

  else if(f.type==='int') inner='<div class="inp"><input id="'+id+'" inputmode="numeric" autocomplete="off" placeholder="'+esc(f.ph||'')+'" value="'+esc(f.value)+'"></div>';
  else if(f.type==='month') inner='<div class="inp"><input id="'+id+'" type="month" value="'+esc(f.value)+'"></div>';
  else if(f.type==='date') inner='<div class="inp"><input id="'+id+'" type="date" value="'+esc(f.value)+'"></div>';

  else inner='<div class="inp"><input id="'+id+'" autocomplete="off" placeholder="'+esc(f.ph||'')+'" value="'+esc(f.value)+'"></div>';

  return '<div class="fld"><label for="'+id+'">'+esc(f.label)+'</label>'+inner+'</div>';

function debtSheet(it){
  openSheet({title:it?'Editar deuda':'Nueva deuda',sub:'Los datos los encuentras en tu estado de cuenta o tabla de pagos.',
    fields:[
      {id:'name',label:'Nombre',type:'text',value:it?it.name:'',ph:'Tarjeta Visa',suggest:it?[]:['Tarjeta de crédito','Préstamo bancario','Préstamo familiar']},
      {id:'balance',label:'Saldo de capital hoy',type:'money',value:it?it.balance:''},
      {id:'rate',label:'Tasa de interés real',type:'pct',value:it?it.rate:'',hint:'Si de cada cuota casi no baja el capital, tu tasa real es más alta que la del contrato. Pide la tasa efectiva al banco.'},
      {id:'min',label:'Cuota mensual',type:'money',value:it?it.min:'',hint:'La cuota que pagas cada mes después del periodo de gracia.'},
      {id:'day',label:'Día del mes de pago',type:'int',value:it&&it.day?it.day:'',ph:'Ej. 25'},
      {id:'grace',label:'Mes del pago grande (si hay periodo de gracia)',type:'month',value:it&&it.graceUntil?it.graceUntil:'',hint:'Hasta ese mes no pagas cuota. Déjalo vacío si pagas todos los meses.'},
      {id:'lump',label:'Monto del pago grande',type:'money',value:it&&it.lump?it.lump:'',hint:'Lo que te cobran ese mes, normalmente los intereses acumulados.'}],
    del:it?()=>{S.debts=S.debts.filter(x=>x.id!==it.id);V.sim=null;closeSheet();done();}:null,
    onSubmit:v=>{const b=num(v.balance),r=num(v.rate),m=num(v.min),L=num(v.lump),D=parseDay(v.day);
      if(D===false)return bad('El día de pago debe ser entre 1 y 31.');
      if(!v.name.trim()||b<=0)return bad('Pon un nombre y el saldo que debes.');
      if(r<0||r>200)return bad('Revisa la tasa: debe estar entre 0 y 200.');
      if(v.grace&&lumpIdx({graceUntil:v.grace})<1)return bad('El mes del pago grande ya pasó. Elige un mes futuro.');
      const g=v.grace||'';
      if(it){it.name=v.name.trim();it.balance=b;it.rate=r;it.min=m;it.initial=Math.max(it.initial,b);it.graceUntil=g;it.lump=g?L:0;it.day=D;}

      V.sim=null;done();}});
}

/* ---------- flujo del mes ---------- */
function flowLedger(k){
  const L=[],pd=S.paid[k]||{},evs=monthEvents(k);
  Object.keys(pd).forEach(id=>{
    const r=pd[id],e=evs.find(x=>x.id===id);
    const kind=r.kd||(e?e.kind:'out'),name=r.n||(e?e.name:'Pago'),date=r.d||(e&&e.day?ymd(dueDate(e.day,k)):k+'-01');
    L.push({date,name,amount:r.a,kind,src:'cal'});
  });
  S.expenses.filter(x=>x.date.slice(0,7)===k).forEach(x=>{const f=x.fixedId?S.essentials.find(y=>y.id===x.fixedId):null;L.push({date:x.date,name:f?(x.name&&x.name!==f.name?f.name+' · '+x.name:f.name):x.name,amount:x.amount,kind:'out',src:f?'cal':'gasto'});});
  L.sort((a,b)=>a.date.localeCompare(b.date));
  let run=0;L.forEach(l=>{run+=l.kind==='in'?l.amount:-l.amount;l.run=run;});
  return L;
}
function vFlujo(c){
  const k=V.month,cur=k===ym(),L=flowLedger(k);
  const inc=sum(L.filter(l=>l.kind==='in'),'amount'),paid=sum(L.filter(l=>l.kind==='out'&&l.src==='cal'),'amount'),vexp=sum(L.filter(l=>l.src==='gasto'),'amount');
  const net=inc-paid-vexp,open=S.open[k],hasOpen=open!==undefined&&open!==null;
  const ev=cur?monthEvents(k):[];
  const pOut=ev.filter(e=>e.kind==='out'&&!e.done).reduce((t,e)=>t+Math.max(0,e.amount-(e.paid||0)),0),pIn=sum(ev.filter(e=>e.kind==='in'&&!e.done),'amount');
  let h=demoBanner()+'<div class="mnav"><button data-act="mprev" aria-label="Mes anterior">‹</button><div class="nm">'+monthName(k)+'</div><button data-act="mnext" aria-label="Mes siguiente">›</button></div>';
  h+=heroCard({label:'Balance del mes',chip:hasOpen?'Empezaste con '+fmt(open):'',val:net,neg:net<0,
    sub:net<0?(inc===0?'Aún no cobras este mes: estás pagando con lo que guardaste del mes pasado.':'Por ahora has pagado más de lo que has cobrado este mes.'):'Lo cobrado menos lo pagado y gastado hasta hoy.',
    three:true,foot:hv('Cobrado',fmt(inc))+hv('Pagos',fmt(paid))+hv('Gastos',fmt(vexp))});
  const r=(l,v,cls)=>'<div class="row"><span class="m"><b>'+l+'</b></span><span class="a '+(cls||'')+'">'+v+'</span></div>';
  let rows='';
  if(hasOpen)rows+=r('Empezaste el mes con',fmt(open))+r('Te quedan ahora',fmt(open+net),open+net<0?'neg':'');
  if(cur){rows+=r('Por pagar este mes',fmt(pOut))+r('Por cobrar este mes',fmt(pIn),'pos');
    const base=hasOpen?open+net:c.liquid;
    if(hasOpen||S.accounts.length)rows+=r('Terminarías el mes con',fmt(base+pIn-pOut),base+pIn-pOut<0?'neg':'');}
  h+='<section><div class="card tight"><div class="rows">'+(rows||empty('Registra pagos, ingresos y gastos y aquí verás cómo va tu mes.'))+'</div></div><div class="stack-btns" style="margin-top:14px"><button class="link" data-act="opening">'+(hasOpen?'Cambiar':'Poner')+' con cuánto empecé el mes</button></div></section>';
  h+='<section><div class="sec"><h2 class="h">Movimientos del mes</h2></div><div class="card tight"><div class="rows">'+(L.length?L.map(l=>'<div class="row"><span class="m"><b>'+esc(l.name)+'</b><small>'+dayLabel(l.date)+'</small></span><span class="a" style="text-align:right"><span class="'+(l.kind==='in'?'pos':'neg')+'">'+(l.kind==='in'?'+':'−')+fmt2(l.amount)+'</span><small style="display:block;color:var(--ink2);font-weight:500;font-size:12px">Balance '+fmt(l.run)+'</small></span></div>').join(''):empty('Aún no hay movimientos este mes. Marca tus pagos como hechos o anota tus gastos.'))+'</div></div></section>';
  return h;
}

/* ---------- calendario de pagos ---------- */
const dim=(y,m)=>new Date(y,m+1,0).getDate();
function parseDay(v){const t=String(v==null?'':v).trim();if(!t)return 0;const n=parseInt(t,10);return(n>=1&&n<=31)?n:false;}
function dueDate(day,k){const a=k.split('-').map(Number);return new Date(a[0],a[1]-1,Math.min(day,dim(a[0],a[1]-1)));}
function monthEvents(k){
  const pd=S.paid[k]||{},ev=[];
  const add=(kind,id,name,amount,day,extra)=>{const r=pd[id];ev.push(Object.assign({kind,id,name,amount,day:day||0,done:!!r,real:r||null},extra||{}));};
  S.incomes.forEach(x=>add('in','i:'+x.id,x.name,x.amount,x.day));
  S.essentials.forEach(x=>{
    const part=sum(S.expenses.filter(e=>e.fixedId===x.id&&e.date.slice(0,7)===k)),r=pd['e:'+x.id],tot=part+(r?r.a:0);
    ev.push({kind:'out',id:'e:'+x.id,name:x.name,amount:x.amount,day:x.day||0,done:!!r||(tot>=x.amount-0.005&&tot>0),real:r||(part>0?{a:part}:null),paid:tot,part,ref:x});
  });
  if(k===ym())S.debts.filter(d=>d.balance>0.005||pd['d:'+d.id]).forEach(d=>{
    const kl=lumpIdx(d);
    if(kl===1&&d.lump>0)add('out','d:'+d.id,'Pago grande · '+d.name,d.lump,d.day,{debt:d.id,lump:true});
    else if(kl<1&&d.min>0)add('out','d:'+d.id,'Cuota · '+d.name,d.min,d.day,{debt:d.id});
  });
  return ev;
}
function evRow(e){
  const today=new Date().getDate();let st,cls='';
  const due=!e.day?'Varía':(()=>{const d=e.day-today;if(d<0)cls='neg';return d<0?'Pendiente desde el '+e.day:d===0?'Hoy':d===1?'Mañana':'Día '+e.day+' · en '+d+' días';})();
  if(e.done){st='Hecho · '+fmt2(e.paid||e.real.a);cls='pos';}
  else if(e.paid>0){st='Pagado '+fmt(e.paid)+' de '+fmt(e.amount)+(e.day?' · '+due:'');}
  else st=due;
  return '<button class="row'+(e.done?' done':'')+'" data-act="mark" data-id="'+e.id+'"><span class="m"><b>'+esc(e.name)+'</b><small>'+(e.kind==='in'?'Ingreso':'Pago')+' · '+st+'</small></span><span class="a '+(e.kind==='in'?'pos':'')+'">'+(e.kind==='in'?'+':'')+fmt(e.amount)+'</span></button>';
}
function flowAlert(c){
  const now=new Date(),today=now.getDate(),n=dim(now.getFullYear(),now.getMonth());
  const ev=monthEvents(ym()).filter(e=>!e.done&&e.day>=today&&e.day>0);
  let bal=c.liquid,min=bal,minDay=0;
  for(let d=today;d<=n;d++){ev.filter(e=>e.day===d).forEach(e=>{bal+=e.kind==='in'?e.amount:-Math.max(0,e.amount-(e.paid||0));});if(bal<min){min=bal;minDay=d;}}
  return min<0?{day:minDay,min}:null;
}
function nextIncomeInfo(){

  const cand=monthEvents(k).filter(e=>e.kind==='in'&&!e.done&&e.day>=today&&e.day>0).sort((a,b)=>a.day-b.day)[0];
  if(cand)return {date:dueDate(cand.day,k),name:cand.name,amount:cand.amount};
  const ins=S.incomes.filter(x=>x.day>0).sort((a,b)=>a.day-b.day)[0];
  return ins?{date:dueDate(ins.day,shiftMonth(k,1)),name:ins.name,amount:ins.amount}:null;
}

  S.moves=S.moves.filter(m=>m.ref!==k+id);
  delete S.paid[k][id];
}

      {id:'acc',label:isIn?'Depositar en':'Pagar desde',type:'chips',options:names.concat([none]),value:rec?(rec.acc||none):((!isIn&&ev.day>0&&ev.day<new Date().getDate())?none:(names[0]||none))}],
    submit:rec?'Guardar cambios':(isIn?'Registrar ingreso':'Marcar pagado'),delLabel:'Deshacer',
    del:rec?()=>{revertPaid(k,id);closeSheet();done();toast('Deshecho.');}:null,
    onSubmit:v=>{
      const a=num(v.amount);if(a<=0)return bad('Pon un monto mayor a cero.');
      const ac=v.acc===none?null:accBy(v.acc);
      if(!isIn&&ac){const avail=ac.balance+(rec&&rec.acc===ac.name?rec.a:0);if(a>avail)return bad('No alcanza: '+ac.name+' tiene '+fmt2(avail)+'.');}
      if(rec)revertPaid(k,id);
      let pr=0;
      if(ev.debt){const d=S.debts.find(x=>x.id===ev.debt);
        if(d&&!ev.lump){const it=d.balance*d.rate/1200;pr=Math.max(0,Math.min(d.balance,a-it));d.balance=Math.max(0,+(d.balance-pr).toFixed(2));}
        S.payments.push({id:uid(),debt:ev.debt,name:d?d.name:ev.name,amount:a,date:ymd(),ref:k+id});}
      if(ac){ac.balance=+(ac.balance+(isIn?a:-a)).toFixed(2);S.moves.push({id:uid(),date:ymd(),kind:isIn?'dep':'wd',acc:ac.name,amount:a,note:(isIn?'Ingreso: ':'Pago: ')+ev.name,ref:k+id});}
      S.paid[k]=S.paid[k]||{};S.paid[k][id]={a,acc:ac?ac.name:'',pr,d:(!isIn&&ev.day>0&&ev.day<new Date().getDate())?ymd(dueDate(ev.day,k)):ymd(),n:ev.name,kd:ev.kind};
      V.sim=null;done();
      if(isIn)setTimeout(()=>adviseSheet(0,ev.name,a),80);
    }});
}
function adviseSheet(addX,name,amount){
  openSheet({title:'Plan para este dinero',sub:name?'Registraste '+fmt(amount)+' de '+esc(name)+'. Así lo repartiría:':'Así lo repartiría:',fields:[],after:adviseCash(addX),noSubmit:true,cancel:'Listo'});
}
function calText(){
  const ev=monthEvents(ym()).sort((a,b)=>(a.day||99)-(b.day||99));
  return ev.length?ev.map(e=>e.name+' ('+(e.kind==='in'?'ingreso ':'pago ')+fmt(e.amount)+(e.day?', día '+e.day:', varía')+(e.done?', hecho':(e.paid>0?', pagado '+fmt(e.paid):', pendiente'))+')').join('; '):'sin fechas registradas';
}

/* ---------- ¿qué hago con dinero nuevo? ---------- */
function adviseCash(addX){
  const c=calc(),P=PLANS[S.plan]||PLANS.equilibrado,now=new Date(),k=ym(),nk=shiftMonth(k,1);
  const ni=nextIncomeInfo(),end=ni?ni.date:new Date(now.getFullYear(),now.getMonth()+1,0),endKey=ym(end),endDay=end.getDate();
  const label=endDay+' de '+MESES[end.getMonth()];
  const pick=key=>monthEvents(key).filter(e=>e.kind==='out'&&!e.done&&(key===k?(e.day===0||dueDate(e.day,key)<=end):(e.day>0&&e.day<endDay)));
  let items=pick(k);if(endKey===nk)items=items.concat(pick(nk));
  items.sort((a,b)=>(a.day||99)-(b.day||99));
  items.forEach(e=>{e.rem=Math.max(0,e.amount-(e.paid||0));});
  const B=sum(items,'rem'),daysN=Math.max(1,Math.round((end-now)/864e5));
  const liq=c.liquid+addX,R=liq-B;
  const lks=c.active.map(lumpIdx).filter(x=>x>=1),months=lks.length?Math.min.apply(null,lks)-1:0;
  const lump=sum(c.active.filter(d=>lumpIdx(d)>=1),'lump'),hole=Math.max(0,-c.free)*months;
  const target=lump>0?lump+hole:c.cushion;
  const food=/comida|aliment|mercado|supermercado/i;
  const rowsHTML=items.map(e=>'<div class="leg"><span class="dot" style="background:var(--c-ess)"></span><span><b>'+esc(e.name)+'</b><small>'+(e.day?'El día '+e.day:'Este mes')+(food.test(e.name)?' · unos '+fmt(e.rem/daysN)+' al día':'')+'</small></span><span class="a">'+fmt(e.rem)+'</span></div>').join('');
  let h='<div class="lab" style="margin:4px 0 4px">Primero, tus pagos hasta el '+label+'</div>'+
    (items.length?'<div class="legs">'+rowsHTML+'</div><div class="tot" style="border-top:0;padding:10px 0 0"><span class="muted">Separa en total</span><b>'+fmt(B)+'</b></div>':'<p class="small muted">No tienes pagos pendientes hasta esa fecha.</p>');
  if(R<0)return h+'<div style="margin-top:12px">'+insHTML({t:'bad',h:'No te alcanza: faltan '+fmt(-R),p:'Con '+fmt(liq)+' disponibles no cubres esos pagos. Prioriza arriendo, servicios y comida, y no toques nada para ahorro ni deuda hasta que entre más dinero.'})+'</div>';
  const toRes=Math.min(R,target),rest=R-toRes,share=c.active.length?P.debt/(P.debt+P.pers):0,toDebt=Math.round(rest*share),toYou=Math.round(rest)-toDebt,rows=[];
  if(toRes>0)rows.push(['Reserva',lump>0?'Para el hueco de los meses sin cuota y el pago grande de '+afterMonths(Math.min.apply(null,lks)-1)+'.':'Colchón de tus gastos fijos.',toRes,'var(--c-save)']);
  if(toDebt>0){const e=c.plan.ok?lumpEffect(c,toDebt):null,pr=priority();rows.push(['Abonar a '+(pr?pr.name:'tu deuda'),e&&e.interest>1?'Ahorras '+fmt(e.interest)+' en intereses y terminas '+span(Math.max(0,e.months))+' antes.':'Baja el capital y los intereses.',toDebt,'var(--c-extra)']);}
  if(toYou>0)rows.push(['Para ti o tus metas','Lo que queda después de proteger tu reserva.',toYou,'var(--c-free)']);
  h+='<div class="lab" style="margin:18px 0 4px">Lo que queda: '+fmt(R)+'</div><div class="legs">'+rows.map(r=>'<div class="leg"><span class="dot" style="background:'+r[3]+'"></span><span><b>'+esc(r[0])+'</b><small>'+esc(r[1])+'</small></span><span class="a">'+fmt(r[2])+'</span></div>').join('')+'</div>';
  const gap=Math.max(0,target-R);
  h+='<div style="margin-top:8px">'+(gap>0?insHTML({t:'warn',h:'A tu reserva aún le faltan '+fmt(gap),p:'La meta es '+fmt(target)+(lump>0?' (hueco más pago grande)':' (colchón)')+'. Mientras no la completes, no abones a la deuda.'}):insHTML({t:'good',h:'Tu reserva quedaría completa',p:'Lo demás ya puede trabajar para ti.'}))+'</div>';
  return h;
}

function cashSheet(){
  openSheet({title:'¿Qué hago con este dinero?',sub:'Pon cuánto te entró y te digo cómo repartirlo, empezando por proteger tu reserva.',
    fields:[{id:'amount',label:'Monto que te entró',type:'money',value:''}],after:'<div id="cashres" style="margin-top:18px"></div>',submit:'Ver qué hacer',
    onSubmit:v=>{const a=num(v.amount);if(a<=0)return bad('Pon cuánto te entró.');$('#cashres').innerHTML=adviseCash(a);return false;}});
}

function summary(c){
  const p=priority();
  const L=['RESUMEN FINANCIERO · '+new Date().toLocaleDateString('es-EC'),'',
    'Ingreso mensual: '+fmt(c.I)+(S.incomes.length?' ('+S.incomes.map(x=>x.name+' '+fmt(x.amount)).join(', ')+')':''),
    'Gastos esenciales: '+fmt(c.E)+(S.essentials.length?' ('+S.essentials.map(x=>x.name+' '+fmt(x.amount)).join(', ')+')':''),'',
    'DEUDAS (total '+fmt(c.debtTotal)+', intereses '+fmt(c.intM)+' al mes):'].concat(
    c.active.map(d=>'- '+d.name+': saldo '+fmt(d.balance)+', tasa '+pct(d.rate)+' anual, cuota '+fmt(d.min)+(lumpIdx(d)>=1?' (sin cuota hasta '+afterMonths(lumpIdx(d)-1)+(d.lump?', pago grande de '+fmt(d.lump):'')+')':'')),
    ['','Disponible tras esenciales y mínimos: '+fmt(c.free),
    'Plan "'+PLANS[S.plan].n+'": extra a deuda '+fmt(c.extra)+', ahorro '+fmt(c.savings)+', para gastar '+fmt(c.pers),
    'Estrategia: '+(S.strategy==='avalancha'?'avalancha':'bola de nieve')+(p?' (prioridad: '+p.name+')':''),
    'Fecha estimada libre de deudas: '+(c.plan.ok&&c.active.length?afterMonths(c.plan.months-1)+' ('+span(c.plan.months)+')':'sin fecha con los pagos actuales'),
    'Gasto personal de '+monthName(V.month)+': '+fmt(c.spent)+' de '+fmt(c.pers),
    (()=>{const m=monthData(V.month);const cats=Object.entries(m.by).sort((a,b)=>b[1]-a[1]).map(x=>x[0]+' '+fmt(x[1])).join(', ');const rep=m.names.filter(x=>x.c>=2).sort((a,b)=>b.t-a.t).slice(0,5).map(x=>x.n+' ('+x.c+' veces, '+fmt(x.t)+')').join(', ');return 'Por categoría: '+(cats||'sin gastos')+'. Repetidos: '+(rep||'ninguno')+'. Depósitos de ahorro del mes: '+fmt(m.dep)+'. Pagos a deudas del mes: '+fmt(m.paid)+'.';})(),
    'DINERO GUARDADO: '+(S.accounts.length?S.accounts.map(a=>a.name+' '+fmt(a.balance)+(a.type==='bloqueada'?' (bloqueada, garantía)':'')+(a.type==='inversion'&&a.rate?' (rinde '+pct(a.rate)+' anual)':'')).join(', ')+'. Patrimonio neto '+fmt(c.net):'sin registrar'),'',
    'CALENDARIO DEL MES: '+calText(),'',
    'Actúa como mi estratega financiero. Dime qué ajustarías en el reparto, qué recortar, qué compras debería evitar, cómo acelerar mis deudas y qué hacer con mis ahorros e inversiones.']);
  return L.join('\n');
}

  close:closeSheet,
  'sheet-del':()=>{if(cur&&cur.del)cur.del();},

    onSubmit:v=>{try{const o=JSON.parse(v.t);if(!o||!Array.isArray(o.debts)||!Array.isArray(o.incomes))throw 0;S=Object.assign(DEF(),o);V.sim=null;applyTheme();done();toast('Datos restaurados.');}catch(e){return bad('El respaldo no es válido. Cópialo completo.');}}}),
  wipe:()=>openSheet({title:'Borrar todo',sub:'Se eliminan ingresos, deudas, gastos y metas de este dispositivo. No se puede deshacer.',submit:'Borrar todo',

  'edit-name':()=>openSheet({title:'Tu nombre',fields:[{id:'n',label:'Nombre',type:'text',value:S.name}],onSubmit:v=>{if(!v.n.trim())return bad('Escribe un nombre.');S.name=v.n.trim();done();}})
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act],[data-tab]');

  const f=A[t.dataset.act];if(f)f(t,e);
});

  if(e.target.id==='simR'){V.sim=+e.target.value;$('#simV').textContent=fmt(V.sim);refreshPlan();}

applyTheme();render(true);
window.__norte={simulate,calc,S:()=>S};
